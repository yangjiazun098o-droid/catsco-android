<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CatsCo · 安卓原生设备</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeeef0;color:#242426;font:14px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}header{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;flex-wrap:wrap;border-bottom:1px solid #ddd}strong{font-size:15px}nav{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;padding:8px 11px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#333;cursor:pointer}button:focus-visible{outline:2px solid #147c65}main{min-height:0;flex:1;display:flex;justify-content:center;align-items:center;padding:16px}canvas{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 5px 26px #0002;border:5px solid #252526;border-radius:22px;cursor:pointer;touch-action:manipulation}footer{padding:8px 16px 12px;text-align:center;color:#666;font-size:12px}#status{font-size:12px;color:#666}button:disabled{opacity:.5}
#notification-actions{display:flex;gap:6px;flex-wrap:wrap}#notification-actions[hidden]{display:none}
</style>
<header><div><strong id="preview-title">CatsCo · 安卓原生设备</strong><div id="status" role="status">连接设备…</div></div><nav><div id="notification-actions" hidden><button data-notification="completed">模拟任务完成</button><button data-notification="failed">模拟任务失败</button><button data-notification="quota">模拟额度不足</button></div><button id="back">返回</button><button id="launch">打开 App</button><button id="theme">切换深色</button><button id="pause">暂停画面</button></nav></header>
<main><canvas id="screen" width="540" height="1200" aria-label="安卓设备实际画面，可点击操作"></canvas></main><footer id="device-type">Android · 原生 APK · 连续设备画面</footer>
<script>
const screen=document.getElementById('screen'),status=document.getElementById('status');let paused=false,dark=false,deviceWidth=540,deviceHeight=1200,deviceLabel='设备';
async function action(path){try{const response=await fetch(path,{method:'POST'});if(!response.ok)throw Error();status.textContent='操作已发送 · 原生设备连续画面'}catch{status.textContent='设备操作失败，请稍后重试'}}
let pointerStart;
function position(event){const box=screen.getBoundingClientRect();return {x:Math.max(0,Math.min(deviceWidth-1,Math.floor((event.clientX-box.left-5)/(box.width-10)*deviceWidth))),y:Math.max(0,Math.min(deviceHeight-1,Math.floor((event.clientY-box.top-5)/(box.height-10)*deviceHeight)))}}
screen.onpointerdown=event=>{pointerStart=position(event);screen.setPointerCapture(event.pointerId)};
screen.onpointerup=event=>{if(!pointerStart)return;const end=position(event),start=pointerStart;pointerStart=null;if(Math.hypot(end.x-start.x,end.y-start.y)>20)action('/swipe?x='+start.x+'&y='+start.y+'&endX='+end.x+'&endY='+end.y);else action('/tap?x='+end.x+'&y='+end.y)};
 screen.onpointercancel=()=>pointerStart=null;document.getElementById('back').onclick=()=>action('/back');document.getElementById('launch').onclick=()=>action('/launch');document.getElementById('theme').onclick=()=>{dark=!dark;action('/theme?mode='+(dark?'yes':'no'));document.getElementById('theme').textContent=dark?'切换浅色':'切换深色'};
 let video,retryTimer,videoFrames=0;
 const context=screen.getContext('2d',{alpha:false});
 function closeVideo(){
  clearTimeout(retryTimer);
  retryTimer=undefined;
  const previous=video;
  video=undefined;
  if(!previous)return;
  if(previous.socket.readyState<WebSocket.CLOSING)previous.socket.close();
  if(previous.decoder?.state!=='closed')previous.decoder?.close();
 }
 function avcFrame(data){
  let codec;
  for(let i=0;i+3<data.length;i++){
   if(data[i]!==0||data[i+1]!==0||data[i+2]!==1)continue;
   const header=i+3,type=data[header]&31;
   if(type===7&&header+3<data.length){
    const format=data.subarray(header+1,header+4);
    codec='avc1.'+Array.from(format,byte=>byte.toString(16).padStart(2,'0')).join('');
   }
   if(type===5)return {key:true,codec};
   if(type===1)break;
  }
  return {key:false};
 }
 function connectVideo(){
  if(paused||video)return;
  if(typeof VideoDecoder!=='function'){
   status.textContent='当前浏览器无法播放设备画面';
   return;
  }
  const socket=new WebSocket('ws://'+location.host+'/video');
  socket.binaryType='arraybuffer';
  const connection={socket,decoder:undefined};
  video=connection;
  const isCurrent=()=>video===connection&&!paused;
  const recover=()=>{
   if(!isCurrent())return;
   status.textContent='正在恢复设备画面…';
   closeVideo();
   retryTimer=setTimeout(connectVideo,700);
  };
  let shownFrame=false,timestamp=0,configuredCodec;
  const decoder=new VideoDecoder({
   output:frame=>{
    try{
     if(!isCurrent())return;
     if(screen.width!==frame.displayWidth||screen.height!==frame.displayHeight){
      screen.width=frame.displayWidth;
      screen.height=frame.displayHeight;
     }
     context.drawImage(frame,0,0);
     window.nativeFrames=++videoFrames;
     if(!shownFrame){
      shownFrame=true;
      status.textContent=deviceLabel+'画面已连接';
     }
    }finally{frame.close()}
   },
   error:recover,
  });
  connection.decoder=decoder;
  socket.onmessage=event=>{
   if(!isCurrent())return;
   const data=new Uint8Array(event.data);
   const {key,codec}=avcFrame(data);
   if(!configuredCodec&&!key)return;
   try{
    // Missing a delta invalidates its dependents. A key frame can safely replace a backlog.
    if(decoder.decodeQueueSize>=12||(key&&codec!==configuredCodec)){
     if(!key){recover();return}
     if(decoder.state==='configured')decoder.reset();
     configuredCodec=codec;
     decoder.configure({codec,optimizeForLatency:true});
    }
    decoder.decode(new EncodedVideoChunk({type:key?'key':'delta',timestamp:timestamp+=16667,data}));
   }catch{recover()}
  };
  socket.onerror=recover;
  socket.onclose=recover;
 }
 document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'恢复画面':'暂停画面';if(paused)closeVideo();else connectVideo()};
 document.querySelectorAll('[data-notification]').forEach(button=>{
  button.onclick=()=>action('/preview-event?kind='+button.dataset.notification);
 });
 fetch('/config').then(response=>response.ok?response.json():null).then(config=>{
  if(!config)return;
  deviceWidth=config.deviceWidth;
  deviceHeight=config.deviceHeight;
  if(!videoFrames){screen.width=config.videoWidth;screen.height=config.videoHeight}
  if(config.notificationReview){
   deviceLabel='通知预览';
   document.getElementById('preview-title').textContent='CatsCo · 通知交互预览';
   document.getElementById('notification-actions').hidden=false;
   document.getElementById('launch').textContent='重置预览';
   document.getElementById('device-type').textContent='点击上方按钮模拟通知。右上角的三点或铃铛会展开同一个菜单，点「通知」查看记录。';
  }else if(config.phone){
   deviceLabel='真机';
   document.getElementById('theme').hidden=true;
   document.getElementById('device-type').textContent='安卓真机 · 原生 APK · 连续设备画面';
  }
 }).catch(()=>{}).finally(connectVideo);
</script></html>
